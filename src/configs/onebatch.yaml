defaults:
  - model: lcnn_onebatch
  - writer: wandb
  - metrics: asvspoof
  - datasets: asvspoof_onebatch
  - dataloader: asvspoof
  - transforms: asvspoof
  - _self_
optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4
lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 0.5
  step_size: 10
loss_function:
  _target_: src.loss.LcnnLoss
  weight: [1.0, 9.0]
trainer:
  log_step: 5
  n_epochs: 50
  epoch_len: null
  device_tensors: ["data_object", "labels"]
  resume_from: null
  device: auto
  override: True
  monitor: "min dev_EER"
  save_period: 50
  early_stop: 50
  save_dir: "saved"
  seed: 1
