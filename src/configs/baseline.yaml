defaults:
  - model: lcnn
  - writer: wandb
  - metrics: asvspoof
  - datasets: asvspoof
  - dataloader: asvspoof
  - transforms: asvspoof
  - _self_
optimizer:
  _target_: torch.optim.Adam
  lr: 1e-3
lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 0.5 #gamma was taken from paper attached to task
  step_size: 10
loss_function:
  _target_: src.loss.LcnnLoss
  weight: [1.0, 3.0]
trainer:
  log_step: 50
  n_epochs: 30
  epoch_len: null
  device_tensors: ["data_object", "labels"] # which tensors should be on device (ex. GPU)
  resume_from: null # null or path to the checkpoint dir with *.pth and config.yaml
  device: auto # device name or "auto"
  override: True # if True, will override the previous run with the same name
  monitor: "max dev_EER" # "off" or "max/min metric_name", i.e. our goal is to maximize/minimize metric
  save_period: 2 # checkpoint each save_period epochs in addition to the best epoch
  early_stop: 10 # epochs for early stopping
  save_dir: "saved"
  seed: 1
