defaults:
  - model: lcnn
  - metrics: asvspoof
  - datasets: asvspoof_eval # we do not want to run inference on training data
  - dataloader: asvspoof
  - transforms: asvspoof
  - _self_
inferencer:
  device_tensors: ["data_object", "labels"] # which tensors should be on device (ex. GPU)
  device: auto # device name or "auto"
  save_path: "asvspoof" # any name here, can be a dataset name
  seed: 1
  from_pretrained: "saved/lcnn-baseline/model_best.pth" # path to the pretrained model
